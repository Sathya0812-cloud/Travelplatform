<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Accessible Travel Platform</title>
    <style>
    body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #fbc2ee, #a6c1ea, #90fab0, #ffd3a5);
    font-family: 'Poppins', sans-serif;
    margin: 0;
      }


        .login-container {
            background: #b49b9b;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: #45a049;
        }
        .login-container h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #555;
            font-weight: normal;
        }
        .login-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            text-align: left;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #131212;
            border-radius: 8px;
            font-size: 1rem;
        }
        .password-container {
            position: relative;
        }
        .password-container input {
            padding-right: 40px;
        }
        .password-container .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2rem;
            color: #555;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #45a049;
            color: rgb(248, 242, 242);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .login-container button:hover {
            background-color: #3e8e41;
        }
        .login-container p {
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .login-container a {
            color: #45a049;
            text-decoration: none;
        }
        .login-container a:hover {
            text-decoration: underline;
        }
        
   
    .login-container {
        background: rgba(255, 255, 255, 0.9); /* Add slight transparency */
        padding: 30px 40px;
        border-radius: 15px;
        box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 100%;
        max-width: 400px;
    }


    </style>
</head><body>
    <div class="login-container">
        <h1>Welcome Back!</h1>
        <h2>Your Gateway to Hassle-Free Accessible Travel</h2>
        <form method="POST" action="login.php">
            <label for="id">Your ID</label>
            <input type="text" id="id" name="id" placeholder="Your ID" required>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
           
        </form>
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
</body>
</html>
