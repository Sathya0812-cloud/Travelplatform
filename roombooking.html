        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Accessible Room Booking</title>
            <link rel="stylesheet" href="roombooking.css">
        </head>
        <body>
            <header>
                <h1>Accessible Room Booking</h1>
            </header>
        
            <main>
                <h2 id="selectedPlace"></h2>
                <section id="room-list">
                    <!-- Rooms will be dynamically rendered -->
                </section>
        
                <div class="booking-form">
                    <h3>Book a Room</h3>
                    <form method="POST" action="roombooking.php">
                        <label for="user_id">Your ID</label>
                        <input type="text" id="user_id" name="user_id" placeholder="Your ID" required>
                        
                        <label for="booking_date">Select Booking Date:</label>
                        <input type="date" id="booking_date" name="booking_date" required>
                        
                        <label for="persons">Number of Persons:</label>
                        <input type="number" id="persons" name="persons" min="1" value="1">
                    
                        <input type="hidden" id="room_name" name="room_name"> <!-- Hidden input -->
                        <button type="submit" id="submitBooking">Submit Booking</button>
                    </form>
                    
                </div>
            </main>
        
            <script src="roombooking.js"></script>
        </body>
        </html>
    </main>
