        function showOptions() {

        function showData(type) {
            let place = document.getElementById("place").value;
            let resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "";

            if (place && data[place] && data[place][type]) {
                let items = data[place][type];
                let html = `<h3>${type.charAt(0).toUpperCase() + type.slice(1)} Details:</h3><ul>`;
                
                items.forEach(item => {
                    if (type === "medical" || type === "restaurants") {
                        html += `<li><a href="${item.link}" target="_blank">${item.name}</a></li>`;
                    } else {
                        html += `<li>${item.name} - Contact: ${item.contact}</li>`;
                    }
                });
                
                html += "</ul>";
                resultDiv.innerHTML = html;
            } else {
                resultDiv.innerHTML = "<p>No data available.</p>";
            }
        }
