<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <style>
       body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee, #84fab0, #ffd3a5);
    
    font-family: 'Poppins', sans-serif;
    margin: 0;
}



       .signup-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px 40px;
            width: 400px;
        }
        h1 {
            color: #4caf50;
            text-align: center;
        }
        label {
            font-size: 14px;
            color: #555;
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>Signup</h1>
        <form action="signup.php" method="POST">
            <label for="id">ID</label>
            <input type="text" id="id" name="id" placeholder="Enter your ID" required>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <label for="phoneno">Phone Number</label>
            <input type="text" id="phoneno" name="phoneno" placeholder="Enter your phone number" required>
            <button onclick="location.href='disable.html';">Signup</button>
        </form>
    </div>


    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            const userId = document.getElementById("id").value;
            localStorage.setItem("user_id", userId);
        });
    </script>

</body>
</html>
