<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1em 0;
        }

        main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        h1 {
            margin: 0;
        }

        .contact-details {
            margin-top: 20px;
        }

        .contact-details p {
            margin: 10px 0;
            font-size: 16px;
            line-height: 1.5;
        }

        .contact-details span {
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 10px 0;
            background-color: #4CAF50;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>

    <main>
        <section class="contact-details">
            <h2>Get in Touch</h2>
            <p><span>Address:</span> 123, Green Street, New City, India</p>
            <p><span>Phone:</span> +91-9629292667</p>
            <p><span>Email:</span> support@assistantservices.com</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Assistant Services. All Rights Reserved.</p>
    </footer>
</body>
</html>
